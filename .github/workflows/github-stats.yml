name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Reuses the same ACCESS_TOKEN secret you already created
          token: ${{ secrets.ACCESS_TOKEN }}
          filename: metrics.svg
          base: "header, activity, community, repositories, metadata"
          plugin_languages: yes
